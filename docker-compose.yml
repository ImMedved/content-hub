services:
  mysql:
    image: mysql:8
    container_name: content-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: content_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      
  redis:
    image: redis:7
    container_name: content-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: